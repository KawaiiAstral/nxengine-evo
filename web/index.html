<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>NXEngine Web (demo)</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <h1>NXEngine Web （デモ）</h1>
    <p>注意: オリジナルの Cave Story データは含まれていません。自分でゲームデータを読み込んでください。</p>

    <div id="dropzone" class="dropzone">
      <p>ここにゲームデータ（zip やフォルダ）をドラッグ＆ドロップ</p>
      <input id="fileinput" type="file" webkitdirectory directory multiple />
    </div>

    <canvas id="canvas" width="640" height="480"></canvas>
    <div id="status"></div>
  </div>

  <script src="loader.js"></script>
</body>
</html>
